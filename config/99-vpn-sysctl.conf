# /etc/sysctl.d/99-vpn.conf
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
# Do not accept/send ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
# IPv6 forwarding disables default RA handling and may remove the VPS IPv6 default route.
# accept_ra=2 accepts RA even with forwarding enabled. Check the actual interface using the README commands.
net.ipv6.conf.all.accept_ra = 2
net.ipv6.conf.default.accept_ra = 2
