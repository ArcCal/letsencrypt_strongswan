# /etc/sysctl.d/99-vpn.conf
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
# Do not accept/send ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
# Once IPv6 forwarding is enabled, the kernel stops processing Router Advertisements (RA) by default,
# and the VPS may lose its IPv6 default route.
# accept_ra=2 means keep accepting RA even with forwarding enabled. After deploying, check your
# actual interface with the commands in the README.
net.ipv6.conf.all.accept_ra = 2
net.ipv6.conf.default.accept_ra = 2
