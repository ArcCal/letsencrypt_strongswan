# /etc/swanctl/conf.d/vpn-client.conf -- Linux client (also uses swanctl + charon-systemd)
# Replace vpn.example.com / alice / the password with your own.
connections {
    vpn {
        version = 2
        remote_addrs = vpn.example.com
        vips = 0.0.0.0
        local {
            auth = eap-mschapv2
            eap_id = alice
        }
        remote {
            auth = pubkey
            id = vpn.example.com
        }
        children {
            net {
                remote_ts = 0.0.0.0/0
                # This example does not block native IPv6 outside the VPN.
                # Connect only on a manual `swanctl --initiate`; change to start to connect automatically once the config is loaded
                start_action = none
                dpd_action = restart
            }
        }
    }
}

secrets {
    eap-alice {
        id = alice
        secret = "your password"
    }
}
