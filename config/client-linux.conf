# /etc/swanctl/conf.d/vpn-client.conf —— Linux 客户端(同样用 swanctl + charon-systemd)
# 把 vpn.example.com / alice / 密码换成你自己的。
connections {
    vpn {
        version = 2
        remote_addrs = vpn.example.com
        vips = 0.0.0.0, ::
        local {
            auth = eap-mschapv2
            eap_id = alice
        }
        remote {
            auth = pubkey
            id = vpn.example.com
        }
        children {
            net {
                remote_ts = 0.0.0.0/0, ::/0
                # 手动 `swanctl --initiate` 时才连接;改成 start 则加载配置后自动拨号
                start_action = none
                dpd_action = restart
            }
        }
    }
}

secrets {
    eap-alice {
        id = alice
        secret = "你的密码"
    }
}
