#!/usr/sbin/nft -f
# /etc/nftables.conf —— 适用于"全新 VPS、此前没有任何防火墙规则"的场景。
# 如果你已有防火墙,请只合并 NAT 与 forward 两部分。
# 警告:input 默认策略为 drop。下面的 SSH 端口(22)若与你实际端口不符,会把你锁在门外。

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        # ICMP / ICMPv6(IPv6 邻居发现、路径 MTU 发现都依赖它)
        meta l4proto { icmp, ipv6-icmp } accept

        tcp dport 22 accept                  # SSH,按需修改
        udp dport { 500, 4500 } accept       # IKE 与 NAT-T
        meta l4proto esp accept              # 未经 NAT 时 ESP 直接封装
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        # 允许 VPN 客户端池的流量出网;回程由 conntrack 放行
        ip  saddr 10.10.10.0/24 accept
        ip6 saddr fd10:10:10::/64 accept
        meta l4proto { icmp, ipv6-icmp } accept

        # 隧道内 TCP MSS 钳制,避免大包黑洞
        tcp flags syn tcp option maxseg size set rt mtu
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip vpn_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip saddr 10.10.10.0/24 masquerade
    }
}

table ip6 vpn_nat6 {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip6 saddr fd10:10:10::/64 masquerade
    }
}
