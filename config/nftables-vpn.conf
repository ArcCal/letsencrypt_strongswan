#!/usr/sbin/nft -f
# /etc/nftables.conf -- for the "fresh VPS with no existing firewall rules" scenario.
# If you already have a firewall, merge only the NAT and forward parts.
# WARNING: the input chain's default policy is drop. If the SSH port (22) below doesn't match
# your actual port, you will be locked out.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        # ICMP / ICMPv6 (IPv6 neighbor discovery and path MTU discovery depend on it)
        meta l4proto { icmp, ipv6-icmp } accept

        tcp dport 22 accept                  # SSH, change as needed
        udp dport { 500, 4500 } accept       # IKE and NAT-T
        meta l4proto esp accept              # Plain ESP when there is no NAT
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        # Allow traffic from the VPN client pools out; return traffic is allowed by conntrack
        ip  saddr 10.10.10.0/24 accept
        ip6 saddr fd10:10:10::/64 accept
        meta l4proto { icmp, ipv6-icmp } accept

        # Clamp TCP MSS inside the tunnel to avoid large-packet black holes
        tcp flags syn tcp option maxseg size set rt mtu
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip vpn_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip saddr 10.10.10.0/24 masquerade
    }
}

table ip6 vpn_nat6 {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip6 saddr fd10:10:10::/64 masquerade
    }
}
