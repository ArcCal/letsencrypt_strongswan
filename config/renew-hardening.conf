# /etc/systemd/system/ikev2-vpn-renew.service.d/hardening.conf
[Service]
UMask=0077
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectSystem=strict
ReadWritePaths=/etc/letsencrypt /etc/swanctl
ReadWritePaths=/var/lib/letsencrypt /var/log/letsencrypt
ReadWritePaths=/var/lib/ikev2-vpn/cert.lock
ReadWritePaths=/var/lib/ikev2-vpn/deploy.lock
ProtectHome=yes
InaccessiblePaths=/var/lib/ikev2-vpn/state.json /var/lib/ikev2-vpn/profiles
InaccessiblePaths=-/run/systemd/private -/run/dbus
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
