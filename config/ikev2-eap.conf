# /etc/swanctl/conf.d/ikev2-eap.conf
# IKEv2 远程接入 VPN:服务器用证书认证,客户端用 EAP-MSCHAPv2(用户名/密码)。
# 把 vpn.example.com 换成你自己的域名(必须与证书中的域名一致)。

connections {
    ikev2-eap {
        version = 2
        mobike = yes
        fragmentation = yes
        # 本机监听地址,%any 表示所有地址
        local_addrs = %any
        # 给客户端分配的地址池(见下方 pools)
        pools = vpn4, vpn6
        # 不下发证书请求,避免客户端的 CA 列表被发给对端
        send_certreq = no

        local {
            auth = pubkey
            # 相对于 /etc/swanctl/x509/,由 certbot deploy hook 安装
            certs = vpn-server.pem
            # 必须与证书的 SAN 域名一致,客户端以此校验服务器
            id = vpn.example.com
        }
        remote {
            auth = eap-mschapv2
            # 要求客户端通过 EAP-Identity 提供用户名
            eap_id = %any
        }
        children {
            net {
                # 全流量走 VPN
                local_ts = 0.0.0.0/0, ::/0
                # 死对端检测:对端不响应时清理 SA
                dpd_action = clear
                # esp_proposals 不写则使用 strongSwan 默认安全套件
            }
        }
    }
}

pools {
    vpn4 {
        addrs = 10.10.10.0/24
        dns = 1.1.1.1, 1.0.0.1
    }
    vpn6 {
        # ULA 私有地址段,出网时由 nftables 做 NAT66
        addrs = fd10:10:10::/64
        dns = 2606:4700:4700::1111, 2606:4700:4700::1001
    }
}
