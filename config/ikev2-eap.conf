# /etc/swanctl/conf.d/ikev2-eap.conf
# IKEv2 remote-access VPN: the server authenticates with a certificate, clients with EAP-MSCHAPv2 (username/password).
# Replace vpn.example.com with your own domain (it must match the domain in the certificate).

connections {
    ikev2-eap {
        version = 2
        mobike = yes
        fragmentation = yes
        # Local listening addresses; %any means all addresses
        local_addrs = %any
        # Address pools assigned to clients (see pools below)
        pools = vpn4, vpn6
        # Don't send certificate requests, so our list of CAs isn't sent to the peer
        send_certreq = no

        local {
            auth = pubkey
            # Relative to /etc/swanctl/x509/; installed by the certbot deploy hook
            certs = vpn-server.pem
            # Must match the SAN domain in the certificate; clients verify the server against it
            id = vpn.example.com
        }
        remote {
            auth = eap-mschapv2
            # Require clients to provide their username via EAP-Identity
            eap_id = %any
        }
        children {
            net {
                # Route all traffic through the VPN
                local_ts = 0.0.0.0/0, ::/0
                # Dead peer detection: clear the SA when the peer stops responding
                dpd_action = clear
                # esp_proposals is omitted, so strongSwan's default cipher suites are used
            }
        }
    }
}

pools {
    vpn4 {
        addrs = 10.10.10.0/24
        dns = 1.1.1.1, 1.0.0.1
    }
    vpn6 {
        # ULA private address range; nftables applies NAT66 for outbound traffic
        addrs = fd10:10:10::/64
        dns = 2606:4700:4700::1111, 2606:4700:4700::1001
    }
}
